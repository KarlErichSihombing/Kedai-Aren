server:
  port: ${PORT:8080}

spring:
  application:
    name: ordering-system
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/ordering_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:secretpassword}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

payment:
  gateway:
    endpoint-url: "https://api.mockpayment.com/v1/charge"
    api-key: ${PAYMENT_API_KEY:sk_test_sample_secret_key_12345}276bd6f
