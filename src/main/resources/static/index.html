<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kedai Aren · Pesan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#E6ECE8; --ink:#16231E; --muted:#56665F; --line:#C5D0CA;
    --accent:#0E5A4B; --accent-ink:#FFFFFF; --paper:#FFFFFF;
    --danger:#9A2B1F; --danger-bg:#FBEAE7;
    --sans:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html{scroll-padding-top:1rem}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5}
  .wrap{max-width:1040px;margin:0 auto;padding:2.5rem 1.25rem 4rem}
  header h1{font-size:clamp(2.6rem,7vw,4.6rem);line-height:.95;margin:0;font-weight:800;letter-spacing:-.03em}
  header p{margin:.9rem 0 0;color:var(--muted);max-width:34ch}
  .grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:3rem;margin-top:2.5rem;align-items:start}
  @media (max-width:820px){.grid{grid-template-columns:1fr;gap:2rem}}

  h2{font-size:1.15rem;margin:0 0 .5rem;font-weight:600}
  ul{list-style:none;margin:0;padding:0}

  /* Daftar menu */
  .item{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:1.1rem 0;border-top:1px solid var(--line)}
  .item:last-child{border-bottom:1px solid var(--line)}
  .item h3{margin:0;font-size:1.2rem;font-weight:600}
  .item .price{display:block;font-weight:600}
  .item .stock{display:block;color:var(--muted);font-size:.9rem}
  .stepper{display:flex;align-items:center;gap:.25rem}
  .stepper output{min-width:2.2ch;text-align:center;font-family:var(--mono);font-size:1.05rem}
  .stepper button{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--ink);background:transparent;color:var(--ink);font:600 1.3rem var(--sans);cursor:pointer}
  .stepper button:hover:not(:disabled){background:var(--ink);color:var(--paper)}
  .stepper button:disabled{opacity:.3;cursor:not-allowed}
  .note{color:var(--muted);padding:1rem 0}

  /* Struk */
  .receipt{position:sticky;top:1rem;background:var(--paper);padding:1.75rem 1.5rem 1.5rem;font-family:var(--mono);font-size:.92rem;box-shadow:0 1px 0 var(--line)}
  .receipt::after{content:"";position:absolute;left:0;right:0;bottom:-10px;height:10px;
    background:linear-gradient(135deg,var(--paper) 25%,transparent 25%) -7px 0,linear-gradient(225deg,var(--paper) 25%,transparent 25%) -7px 0;background-size:14px 14px}
  .receipt h2{font-family:var(--sans);font-size:1.3rem;font-weight:800;margin-bottom:1rem}
  .lines li{display:flex;justify-content:space-between;gap:1rem;padding:.35rem 0}
  .lines .empty{color:var(--muted);display:block}
  .total{display:flex;justify-content:space-between;align-items:baseline;border-top:2px dashed var(--ink);margin-top:.75rem;padding-top:.75rem;font-size:1.1rem}
  .total strong{font-size:1.45rem}
  label{display:block;margin-top:1rem;color:var(--muted);font-size:.85rem}
  input,select{width:100%;margin-top:.3rem;padding:.65rem .7rem;font:inherit;color:var(--ink);background:#F3F6F4;border:1.5px solid var(--line);border-radius:6px}
  input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .btn{display:block;width:100%;margin-top:1.25rem;padding:.9rem 1rem;border:0;border-radius:6px;background:var(--accent);color:var(--accent-ink);font:600 1.05rem var(--sans);cursor:pointer}
  .btn:hover:not(:disabled){background:#0A4538}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
  .btn.ghost:hover:not(:disabled){background:var(--ink);color:var(--paper)}
  .btn.danger{background:var(--danger)}
  .alert{margin-top:1rem;padding:.75rem .9rem;border-radius:6px;background:var(--danger-bg);color:var(--danger);font-family:var(--sans);font-size:.95rem}
  .alert:empty{display:none}

  /* Stempel status */
  .stamp{display:inline-block;transform:rotate(-4deg);border:3px solid var(--accent);color:var(--accent);padding:.2rem .8rem;margin-bottom:1rem;
    font:800 1.5rem var(--sans);letter-spacing:.02em;border-radius:4px}
  .stamp.batal{border-color:var(--danger);color:var(--danger)}
  dl{margin:0 0 1rem;display:grid;grid-template-columns:auto 1fr;gap:.3rem 1rem}
  dt{color:var(--muted)} dd{margin:0;text-align:right;overflow-wrap:anywhere}
  .cancelbox{margin-top:1rem}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Kedai Aren</h1>
    <p>Pilih menu, bayar, dan pesananmu langsung tercatat.</p>
  </header>

  <div class="grid">
    <main>
      <h2>Menu hari ini</h2>
      <ul id="menu"><li class="note">Memuat menu…</li></ul>
    </main>

    <aside class="receipt" aria-live="polite">
      <!-- Tampilan keranjang -->
      <section id="cartView">
        <h2>Pesananmu</h2>
        <ul class="lines" id="lines"></ul>
        <div class="total"><span>Total</span><strong id="total">Rp0</strong></div>

        <label for="cust">ID pelanggan</label>
        <input id="cust" value="CUST-001" autocomplete="off">

        <label for="token">Kartu pembayaran (simulasi)</label>
        <select id="token">
          <option value="tok_visa_valid_999">Kartu valid, pembayaran diterima</option>
          <option value="invalid_card">Kartu ditolak oleh gateway</option>
        </select>

        <div class="alert" id="err" role="alert"></div>
        <button class="btn" id="pay" type="button" disabled>Bayar sekarang</button>
      </section>

      <!-- Tampilan hasil pesanan -->
      <section id="orderView" hidden>
        <div class="stamp" id="stamp"></div>
        <dl id="meta"></dl>
        <ul class="lines" id="orderLines"></ul>
        <div class="total"><span>Total</span><strong id="orderTotal"></strong></div>

        <div class="cancelbox" id="cancelBox">
          <button class="btn ghost" id="cancelOpen" type="button">Batalkan pesanan</button>
          <div id="cancelForm" hidden>
            <label for="alasan">Alasan pembatalan</label>
            <input id="alasan" placeholder="Contoh: ingin mengganti menu">
            <div class="alert" id="cancelErr" role="alert"></div>
            <button class="btn danger" id="cancelSend" type="button">Batalkan pesanan ini</button>
          </div>
        </div>
        <button class="btn" id="again" type="button">Buat pesanan baru</button>
      </section>
    </aside>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const rp = n => new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let menu = [], qty = {}, order = null;

async function api(path, opts){
  const res = await fetch(path, opts);
  let body = null;
  try { body = await res.json(); } catch (e) {}
  if (!res.ok){
    const detail = body && body.errors ? Object.values(body.errors).join(', ') : '';
    const msg = body && body.message ? body.message : 'Server tidak merespons (status ' + res.status + ')';
    throw new Error(detail ? msg + ': ' + detail : msg);
  }
  return body;
}

function cartItems(){
  return menu.filter(m => (qty[m.idMenu] || 0) > 0)
             .map(m => ({nama: m.namaMenu, jumlah: qty[m.idMenu], harga: m.harga}));
}
const sum = items => items.reduce((t, i) => t + i.jumlah * i.harga, 0);
const lineHtml = i => `<li><span>${i.jumlah} × ${esc(i.nama)}</span><span>${rp(i.jumlah * i.harga)}</span></li>`;

function renderMenu(){
  if (!menu.length){ $('menu').innerHTML = '<li class="note">Belum ada menu. Tambahkan data menu di database.</li>'; return; }
  $('menu').innerHTML = menu.map(m => {
    const q = qty[m.idMenu] || 0, habis = m.stok <= 0, id = esc(m.idMenu);
    return `<li class="item">
      <div>
        <h3>${esc(m.namaMenu)}</h3>
        <span class="price">${rp(m.harga)}</span>
        <span class="stock">${habis ? 'Stok habis' : 'Sisa ' + m.stok}</span>
      </div>
      <div class="stepper" role="group" aria-label="Jumlah ${esc(m.namaMenu)}">
        <button type="button" data-id="${id}" data-d="-1" aria-label="Kurangi ${esc(m.namaMenu)}" ${q === 0 ? 'disabled' : ''}>−</button>
        <output>${q}</output>
        <button type="button" data-id="${id}" data-d="1" aria-label="Tambah ${esc(m.namaMenu)}" ${q >= m.stok ? 'disabled' : ''}>+</button>
      </div>
    </li>`;
  }).join('');
}

function renderCart(){
  const items = cartItems();
  $('lines').innerHTML = items.length
    ? items.map(lineHtml).join('')
    : '<li class="empty">Belum ada menu dipilih. Tambahkan dari daftar menu.</li>';
  $('total').textContent = rp(sum(items));
  $('pay').disabled = items.length === 0;
}

function renderOrder(){
  const batal = order.statusPesanan === 'BATAL';
  $('stamp').textContent = batal ? 'Dibatalkan' : 'Dibayar';
  $('stamp').className = 'stamp' + (batal ? ' batal' : '');
  const tgl = new Date(order.tanggal).toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'});
  $('meta').innerHTML =
    `<dt>No. pesanan</dt><dd>${esc(order.idPesanan)}</dd>
     <dt>Waktu</dt><dd>${esc(tgl)}</dd>
     <dt>Referensi bayar</dt><dd>${esc(order.kodeReferensi || '-')}</dd>
     <dt>Status</dt><dd>${batal ? 'Batal' : 'Diproses'}</dd>`;
  $('orderLines').innerHTML = order.items.map(lineHtml).join('');
  $('orderTotal').textContent = rp(order.totalBiaya);
  $('cancelBox').hidden = batal;
}

function show(view){
  $('cartView').hidden = view !== 'cart';
  $('orderView').hidden = view !== 'order';
}

async function loadMenu(){
  try {
    const body = await api('/api/v1/menu');
    menu = body.data || [];
    renderMenu(); renderCart();
  } catch (e) {
    $('menu').innerHTML = `<li class="note">Menu belum bisa dimuat. ${esc(e.message)}. Muat ulang halaman sebentar lagi.</li>`;
  }
}

$('menu').addEventListener('click', e => {
  const b = e.target.closest('button[data-id]');
  if (!b) return;
  const id = b.dataset.id, m = menu.find(x => x.idMenu === id);
  const next = Math.max(0, Math.min(m.stok, (qty[id] || 0) + Number(b.dataset.d)));
  qty[id] = next;
  renderMenu(); renderCart();
});

$('pay').addEventListener('click', async () => {
  const items = cartItems();
  $('err').textContent = '';
  $('pay').disabled = true; $('pay').textContent = 'Memproses…';
  try {
    const keranjangData = menu.filter(m => (qty[m.idMenu] || 0) > 0)
                              .map(m => ({idMenu: m.idMenu, jumlah: qty[m.idMenu]}));
    const body = await api('/api/v1/checkout', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        idPelanggan: $('cust').value.trim(),
        metodePembayaran: 'CREDIT_CARD',
        tokenKartu: $('token').value,
        keranjangData
      })
    });
    order = {...body.data, items};
    qty = {};
    await loadMenu();
    renderOrder(); show('order');
  } catch (e) {
    $('err').textContent = e.message;
  } finally {
    $('pay').textContent = 'Bayar sekarang';
    renderCart();
  }
});

$('cancelOpen').addEventListener('click', () => {
  $('cancelOpen').hidden = true; $('cancelForm').hidden = false; $('alasan').focus();
});

$('cancelSend').addEventListener('click', async () => {
  $('cancelErr').textContent = '';
  const alasan = $('alasan').value.trim();
  if (!alasan){ $('cancelErr').textContent = 'Isi alasan pembatalan dulu.'; return; }
  $('cancelSend').disabled = true;
  try {
    await api('/api/v1/checkout/' + encodeURIComponent(order.idPesanan) + '/batal', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({alasan})
    });
    order.statusPesanan = 'BATAL';
    await loadMenu();
    renderOrder();
  } catch (e) {
    $('cancelErr').textContent = e.message;
  } finally {
    $('cancelSend').disabled = false;
  }
});

$('again').addEventListener('click', () => {
  order = null; $('alasan').value = ''; $('cancelErr').textContent = '';
  $('cancelOpen').hidden = false; $('cancelForm').hidden = true;
  show('cart'); renderCart();
});

loadMenu();
</script>
</body>
</html>
